name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build & Attest Images
    needs: [tests]
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.tag || github.ref_name }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  chart:
    name: Build & Attest Chart
    needs: [image]
    uses: ./.github/workflows/build-chart.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.tag || github.ref_name }}
      jasmin-digest: ${{ needs.image.outputs.jasmin-digest }}
      image-digest: ${{ needs.image.outputs.gui-digest }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      ARTIFACTHUB_API_KEY_ID: ${{ secrets.ARTIFACTHUB_API_KEY_ID }}
      ARTIFACTHUB_API_KEY_SECRET: ${{ secrets.ARTIFACTHUB_API_KEY_SECRET }}

  github-release:
    name: GitHub Release
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          JASMIN_IMAGE: ${{ needs.image.outputs.jasmin-image }}
          JASMIN_DIGEST: ${{ needs.image.outputs.jasmin-digest }}
          GUI_IMAGE: ${{ needs.image.outputs.gui-image }}
          GUI_DIGEST: ${{ needs.image.outputs.gui-digest }}
          CHART: ${{ needs.chart.outputs.chart }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<EOF
          # Jasmin SMS Gateway Release ${TAG}

          ## Helm Installation

          \`\`\`sh
          helm install jasmin oci://${CHART} --version ${version} --namespace jasmin --create-namespace
          \`\`\`

          ## Artifacts & References

          | Artifact | Reference |
          |---|---|
          | **Jasmin Gateway Image** | \`${JASMIN_IMAGE}:${version}@${JASMIN_DIGEST}\` |
          | **Dashboard GUI Image** | \`${GUI_IMAGE}:${version}@${GUI_DIGEST}\` |
          | **Helm Chart** | \`${CHART}:${version}@${CHART_DIGEST}\` |

          ## Security & Supply Chain Verification (SLSA Level 3)

          Verify cryptographic provenance and Sigstore signatures directly with GitHub CLI:

          \`\`\`sh
          # Verify container images provenance (SLSA Build Level 3)
          gh attestation verify oci://${JASMIN_IMAGE}:${version} --owner ${GITHUB_REPOSITORY_OWNER} \\
            --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build-image.yml

          gh attestation verify oci://${GUI_IMAGE}:${version} --owner ${GITHUB_REPOSITORY_OWNER} \\
            --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build-image.yml

          # Verify Helm chart provenance (SLSA Build Level 3)
          gh attestation verify oci://${CHART}:${version} --owner ${GITHUB_REPOSITORY_OWNER} \\
            --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/build-chart.yml

          # Verify Cosign keyless signatures
          cosign verify ${JASMIN_IMAGE}:${version} --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify ${GUI_IMAGE}:${version} --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify ${CHART}:${version} --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          \`\`\`
          EOF

          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/*.tgz --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --generate-notes --verify-tag "${prerelease[@]}"

  lifecycle:
    name: OCI Artifacts Lifecycle (Keep Latest Release Only)
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Prune older releases & OCI artifacts using ORAS
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower="${OWNER,,}"
          current_version="${CURRENT_TAG#v}"
          echo "[INFO] Current latest release tag: $CURRENT_TAG (version: $current_version)"

          # Authenticate ORAS with GitHub Container Registry
          echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Find all existing git tags starting with v* except the current one
          older_tags=$(git tag -l "v*" --sort=-v:refname | grep -v "^${CURRENT_TAG}$" || true)

          if [ -z "$older_tags" ]; then
            echo "[INFO] No older releases found. Keeping current release $CURRENT_TAG."
            exit 0
          fi

          echo "[INFO] Older release tags to prune safely using ORAS:"
          echo "$older_tags"

          for old_tag in $older_tags; do
            old_version="${old_tag#v}"
            echo "[INFO] Pruning OCI artifacts for older release: $old_tag ($old_version)..."

            # 1. Safely prune old Helm chart OCI artifact using ORAS
            oras manifest delete --force "ghcr.io/${owner_lower}/charts/jasmin:${old_version}" || true

            # 2. Safely prune old Jasmin Gateway image OCI artifacts using ORAS
            oras manifest delete --force "ghcr.io/${owner_lower}/jasmin:${old_tag}" || true
            oras manifest delete --force "ghcr.io/${owner_lower}/jasmin:${old_version}" || true

            # 3. Safely prune old Dashboard image OCI artifacts using ORAS
            oras manifest delete --force "ghcr.io/${owner_lower}/jasmin-dashboard:${old_tag}" || true
            oras manifest delete --force "ghcr.io/${owner_lower}/jasmin-dashboard:${old_version}" || true
            oras manifest delete --force "ghcr.io/${owner_lower}/jasmin-gui:${old_tag}" || true
            oras manifest delete --force "ghcr.io/${owner_lower}/jasmin-gui:${old_version}" || true

            # 4. Safely delete old GitHub Release and git tag so only the latest release is kept
            gh release delete "$old_tag" --yes --repo "$GITHUB_REPOSITORY" --cleanup-tag || true
            echo "[INFO] Successfully pruned older release $old_tag."
          done

          echo "[INFO] Lifecycle policy enforcement complete. Only latest release ($CURRENT_TAG) is retained."
