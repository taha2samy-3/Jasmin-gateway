# Trusted builder for the Helm chart (SLSA Build Level 3)
# Packages the chart, pins the image digests, publishes to GHCR OCI, signs with Cosign,
# registers the repository on Artifact Hub and pushes metadata layer via ORAS.
name: Build chart (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
      jasmin-digest:
        description: Digest of the Jasmin Gateway image built for this release
        required: true
        type: string
      image-digest:
        description: Digest of the GUI dashboard image built for this release
        required: true
        type: string
    secrets:
      GHCR_PAT:
        required: false
      ARTIFACTHUB_API_KEY_ID:
        required: false
      ARTIFACTHUB_API_KEY_SECRET:
        required: false
    outputs:
      chart:
        description: OCI reference of the chart
        value: ${{ jobs.build.outputs.chart }}
      digest:
        description: Chart digest
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  CHART_DIR: helm/jasmin
  CHART_NAME: jasmin

jobs:
  build:
    name: Build & Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart: ${{ steps.push.outputs.chart }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set chart version, image digests and ArtifactHub metadata
        env:
          TAG: ${{ inputs.version }}
          JASMIN_DIGEST: ${{ inputs.jasmin-digest }}
          GUI_DIGEST: ${{ inputs.image-digest }}
        run: |
          [[ "$JASMIN_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::invalid jasmin digest $JASMIN_DIGEST"; exit 1; }
          [[ "$GUI_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::invalid gui digest $GUI_DIGEST"; exit 1; }
          version="${TAG#v}"
          jasmin_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jasmin"
          gui_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jasmin-dashboard"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"

          changes="$(git log --format='%s' ${prev:+"$prev..$TAG"} -- . ':!.github' | head -30 |
            sed -E 's/"/\\"/g; s/^(.*)$/- kind: changed\n  description: "\1"/')"
          [[ -n "$changes" ]] || changes=$'- kind: changed\n  description: "Release Jasmin SMS Gateway Helm chart"'

          export version jasmin_image gui_image changes
          yq -i '
            .version = strenv(version) |
            .annotations["artifacthub.io/images"] = "- name: jasmin\n  image: " + strenv(jasmin_image) + ":" + strenv(version) + "\n  platforms:\n    - linux/amd64\n    - linux/arm64\n- name: jasmin-dashboard\n  image: " + strenv(gui_image) + ":" + strenv(version) + "\n  platforms:\n    - linux/amd64\n    - linux/arm64\n" |
            .annotations["artifacthub.io/changes"] = strenv(changes) + "\n" |
            .annotations["artifacthub.io/prerelease"] = (strenv(version) | test("-") | tostring)
          ' "$CHART_DIR/Chart.yaml"

          # Pin the exact image digests built for this release in values.yaml
          yq -i '
            .image.repository = strenv(jasmin_image) |
            .image.digest = strenv(JASMIN_DIGEST) |
            .image.tag = strenv(version) |
            .dashboard.image.repository = strenv(gui_image) |
            .dashboard.image.digest = strenv(GUI_DIGEST) |
            .dashboard.image.tag = strenv(version)
          ' "$CHART_DIR/values.yaml"
          cat "$CHART_DIR/Chart.yaml"

      - name: Lint and package Helm chart
        run: |
          cp README.md "$CHART_DIR/README.md"
          helm lint --strict "$CHART_DIR"
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - name: Push Helm chart to GHCR OCI
        id: push
        env:
          TAG: ${{ inputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          out=""
          out="$(helm push "dist/${CHART_NAME}-${TAG#v}.tgz" "oci://$repo" 2>&1)" || {
            echo "::error::Helm push failed: $out"
            exit 1
          }
          echo "$out"
          digest="$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p' <<<"$out")"
          [[ -n "$digest" ]] || { echo "::error::could not read chart digest"; exit 1; }
          echo "chart=$repo/$CHART_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance (SLSA Build Level 3)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest chart archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart (Cosign keyless)
        env:
          REF: ${{ steps.push.outputs.chart }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Register on Artifact Hub & Resolve Repository ID
        env:
          CHART: ${{ steps.push.outputs.chart }}
          AH_KEY_ID: ${{ secrets.ARTIFACTHUB_API_KEY_ID }}
          AH_KEY_SECRET: ${{ secrets.ARTIFACTHUB_API_KEY_SECRET }}
        run: |
          if [[ -z "$AH_KEY_ID" || -z "$AH_KEY_SECRET" ]]; then
            echo "::notice::Artifact Hub API key not configured; skipping automatic registration"
            exit 0
          fi
          api=https://artifacthub.io/api/v1
          url="oci://$CHART"
          hdr=(-H "X-API-KEY-ID: $AH_KEY_ID" -H "X-API-KEY-SECRET: $AH_KEY_SECRET")
          alias="$(curl -fsS "${hdr[@]}" "$api/users/profile" | jq -r .alias)"
          echo "Artifact Hub authenticated as alias: $alias"

          find_id() {
            local res
            res="$(curl -fsS "${hdr[@]}" "$api/repositories/search?user=$alias&name=jasmin" 2>/dev/null || true)"
            if [[ -z "$res" || "$res" == "[]" ]]; then
              res="$(curl -fsS "$api/repositories/search?name=jasmin" 2>/dev/null || true)"
            fi
            jq -r --arg url "$url" '[.[] | select(.url == $url) | .repository_id][0] // empty' <<<"$res"
          }
          id="$(find_id)"
          if [[ -z "$id" && -f artifacthub-repo.yml ]]; then
            id="$(yq 'select(.repositoryID != null) | .repositoryID' artifacthub-repo.yml 2>/dev/null || true)"
          fi
          if [[ -z "$id" ]]; then
            echo "Registering $url on Artifact Hub..."
            jq -n --arg url "$url" '{kind: 0, name: "jasmin", display_name: "Jasmin SMS Gateway", url: $url}' |
              curl -fsS "${hdr[@]}" -H 'Content-Type: application/json' -X POST "$api/repositories/user" --data-binary @- || true
            id="$(find_id)"
          fi

          if [[ -n "$id" ]]; then
            export id
            yq -i '.repositoryID = strenv(id)' artifacthub-repo.yml
            echo "Artifact Hub repository ID: $id"
          else
            echo "::warning::Artifact Hub repository ID could not be resolved automatically"
          fi

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Push Artifact Hub repository metadata
        env:
          CHART: ${{ steps.push.outputs.chart }}
        run: |
          echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "$CHART:artifacthub.io" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error
