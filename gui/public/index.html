<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jasmin Console</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      try {
        const t = localStorage.getItem('jc-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="side-brand">
          <img src="/assets/icon.svg" alt="" />
          <div>
            <div class="brand-name">Jasmin Console</div>
            <div class="brand-sub">SMS gateway management</div>
          </div>
        </div>
        <nav class="nav" id="nav" aria-label="Main"></nav>
        <div class="side-foot" id="side-foot"></div>
      </aside>

      <header class="topbar">
        <button class="btn ghost icon-only menu-btn" id="menu-btn" aria-label="Open menu"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <button class="btn ghost icon-only" id="theme-btn" aria-label="Toggle theme" title="Toggle light / dark"></button>
        <div class="user-chip" id="user-chip" role="button" tabindex="0" aria-haspopup="menu"></div>
      </header>

      <main class="main" id="main"></main>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
