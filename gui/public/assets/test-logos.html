<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Refined Logo Concepts for Jasmin SMS Gateway</title>
  <style>
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 230px);
      gap: 20px;
    }
    .card {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #52525b; }
    .preview {
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
    }
    .nav-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #18181b;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #27272a;
      width: 100%;
    }
    .nav-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .nav-sub {
      font-size: 9px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .label {
      font-size: 13px;
      font-weight: 600;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <h2>Jasmin SMS Gateway — Logo Redesign Options</h2>

  <div class="grid">
    <!-- Option A: The "Signal Conduit J" (Continuous Loop Track) -->
    <div class="card">
      <div class="preview">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
          <path d="M28 12V28C28 32.4183 24.4183 36 20 36C15.5817 36 12 32.4183 12 28C12 25.5 13.5 23.5 15.5 22.5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          <path d="M36 12V22C36 30.8366 28.8366 38 20 38" stroke="#52525B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
          <circle cx="28" cy="12" r="3.5" fill="#FFFFFF"/>
          <circle cx="36" cy="12" r="2.5" fill="#71717A"/>
        </svg>
      </div>
      <div class="label">A. Conduit Wave</div>
      <div class="nav-preview">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#18181B" stroke="#27272A" stroke-width="2"/>
          <path d="M28 12V28C28 32.4183 24.4183 36 20 36C15.5817 36 12 32.4183 12 28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="28" cy="12" r="3.5" fill="#FFFFFF"/>
        </svg>
        <div>
          <div class="nav-text">JASMIN</div>
          <div class="nav-sub">Enterprise Gateway</div>
        </div>
      </div>
    </div>

    <!-- Option B: The "Nexus J" (Monogram + Dynamic Speed Notch) -->
    <div class="card">
      <div class="preview">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#FFFFFF"/>
          <!-- Stylized negative black J with precision speed notch -->
          <path d="M28 10H32V28C32 32.9706 27.9706 37 23 37C18.0294 37 14 32.9706 14 28H19C19 30.2091 20.7909 32 23 32C25.2091 32 27 30.2091 27 28V15L20 22L16.5 18.5L25 10H28Z" fill="#09090B"/>
        </svg>
      </div>
      <div class="label">B. Nexus Monogram</div>
      <div class="nav-preview">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#FFFFFF"/>
          <path d="M28 10H32V28C32 32.9706 27.9706 37 23 37C18.0294 37 14 32.9706 14 28H19C19 30.2091 20.7909 32 23 32C25.2091 32 27 30.2091 27 28V15L20 22L16.5 18.5L25 10H28Z" fill="#09090B"/>
        </svg>
        <div>
          <div class="nav-text">JASMIN</div>
          <div class="nav-sub">Enterprise Gateway</div>
        </div>
      </div>
    </div>

    <!-- Option C: The "Linear Minimalist J" (Stark High-Contrast Blade) -->
    <div class="card">
      <div class="preview">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>
          <!-- Continuous precision ribbon J -->
          <path d="M27 10V28C27 32.4183 23.4183 36 19 36C14.5817 36 11 32.4183 11 28C11 25.5 12.5 23.5 14.5 22.5" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
          <!-- Forward pulse beacon -->
          <path d="M21 10H33" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="33" cy="20" r="2.5" fill="#71717A"/>
        </svg>
      </div>
      <div class="label">C. Linear Minimalist</div>
      <div class="nav-preview">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#09090B" stroke="#27272A" stroke-width="2"/>
          <path d="M27 10V28C27 32.4183 23.4183 36 19 36C14.5817 36 11 32.4183 11 28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M21 10H33" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="nav-text">JASMIN</div>
          <div class="nav-sub">Enterprise Gateway</div>
        </div>
      </div>
    </div>

    <!-- Option D: The "Apex Routing Prism" (Geometric Star Aperture) -->
    <div class="card">
      <div class="preview">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
          <!-- 4 Intersecting Telecom Ray Blades -->
          <path d="M24 8L27 20L39 24L27 28L24 40L21 28L9 24L21 20L24 8Z" fill="#FFFFFF"/>
          <circle cx="24" cy="24" r="5" fill="#18181B"/>
          <circle cx="24" cy="24" r="2.5" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="label">D. Apex Routing Star</div>
      <div class="nav-preview">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#18181B" stroke="#27272A" stroke-width="2"/>
          <path d="M24 8L27 20L39 24L27 28L24 40L21 28L9 24L21 20L24 8Z" fill="#FFFFFF"/>
          <circle cx="24" cy="24" r="5" fill="#18181B"/>
        </svg>
        <div>
          <div class="nav-text">JASMIN</div>
          <div class="nav-sub">Enterprise Gateway</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
