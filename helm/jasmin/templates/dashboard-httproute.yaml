{{- if and .Values.dashboard.enabled .Values.dashboard.httpRoute.enabled -}}
{{- $parents := .Values.dashboard.httpRoute.parentRefs | default .Values.httpRoute.parentRefs -}}
{{- if not $parents }}{{ fail "dashboard.httpRoute.parentRefs (or httpRoute.parentRefs) must not be empty" }}{{ end -}}
{{- if not .Values.dashboard.httpRoute.hostnames }}{{ fail "dashboard.httpRoute.hostnames must list the console hostname" }}{{ end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jasmin.fullname" . }}-console
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.dashboard.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $parents | nindent 4 }}
  # The console runs at the root of its own hostname (it cannot live under a sub-path).
  hostnames:
    {{- toYaml .Values.dashboard.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "jasmin.fullname" . }}-admin
          port: {{ .Values.dashboard.port }}
{{- end }}
