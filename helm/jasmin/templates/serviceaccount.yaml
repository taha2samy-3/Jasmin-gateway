{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jasmin.serviceAccountName" . }}
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither Jasmin nor the console calls the Kubernetes API, so no Role/RoleBinding is created
# and no API token is mounted unless explicitly requested.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
