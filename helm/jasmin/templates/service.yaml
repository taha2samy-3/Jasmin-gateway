apiVersion: v1
kind: Service
metadata:
  name: {{ include "jasmin.fullname" . }}
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") }}
  {{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- end }}
  ports:
    - name: smpp
      port: {{ .Values.service.ports.smpp.port }}
      targetPort: {{ .Values.service.ports.smpp.targetPort }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.smpp.nodePort }}
      nodePort: {{ .Values.service.ports.smpp.nodePort }}
      {{- end }}
    - name: http-api
      port: {{ .Values.service.ports.httpApi.port }}
      targetPort: {{ .Values.service.ports.httpApi.targetPort }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.httpApi.nodePort }}
      nodePort: {{ .Values.service.ports.httpApi.nodePort }}
      {{- end }}
    {{- $adminOnPublic := or (eq .Values.service.type "ClusterIP") .Values.service.exposeAdminPorts }}
    {{- if $adminOnPublic }}
    - name: jcli
      port: {{ .Values.service.ports.jcli.port }}
      targetPort: {{ .Values.service.ports.jcli.targetPort }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.jcli.nodePort }}
      nodePort: {{ .Values.service.ports.jcli.nodePort }}
      {{- end }}
    - name: interceptor
      port: {{ .Values.service.ports.interceptor.port }}
      targetPort: {{ .Values.service.ports.interceptor.targetPort }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ports.interceptor.nodePort }}
      nodePort: {{ .Values.service.ports.interceptor.nodePort }}
      {{- end }}
    {{- if .Values.dashboard.enabled }}
    - name: dashboard
      port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.dashboard.nodePort }}
      nodePort: {{ .Values.dashboard.nodePort }}
      {{- end }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "jasmin.selectorLabels" . | nindent 4 }}
---
# In-cluster access to the administrative ports (jCLI and the console), whatever the
# type of the public Service. Console Ingress/HTTPRoute objects point here.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jasmin.fullname" . }}-admin
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  ports:
    - name: jcli
      port: {{ .Values.service.ports.jcli.port }}
      targetPort: {{ .Values.service.ports.jcli.targetPort }}
      protocol: TCP
    {{- if .Values.dashboard.enabled }}
    - name: dashboard
      port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "jasmin.selectorLabels" . | nindent 4 }}
