apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jasmin.fullname" . }}-secrets
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
type: Opaque
stringData:
  jcli-password: {{ .Values.credentials.jcli.password | quote }}
  rabbitmq-password: {{ .Values.credentials.rabbitmq.password | quote }}
  redis-password: {{ .Values.credentials.redis.password | quote }}
  {{- if and .Values.dashboard.enabled .Values.dashboard.admin.password (not .Values.dashboard.admin.existingSecret) }}
  dashboard-admin-password: {{ .Values.dashboard.admin.password | quote }}
  {{- end }}
  {{- if and .Values.dashboard.enabled .Values.dashboard.oidc.enabled .Values.dashboard.oidc.clientSecret (not .Values.dashboard.oidc.existingSecret) }}
  oidc-client-secret: {{ .Values.dashboard.oidc.clientSecret | quote }}
  {{- end }}
