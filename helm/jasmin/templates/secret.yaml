{{- $secretName := printf "%s-secrets" (include "jasmin.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := (get $existing "data") | default dict -}}
{{- /* jCLI password: explicit value, else the one already stored (stable across upgrades), else random. */ -}}
{{- $jcliPassword := .Values.credentials.jcli.password -}}
{{- if and (not $jcliPassword) (hasKey $existingData "jcli-password") -}}
{{- $jcliPassword = index $existingData "jcli-password" | b64dec -}}
{{- end -}}
{{- if not $jcliPassword -}}
{{- $jcliPassword = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
type: Opaque
stringData:
  jcli-password: {{ $jcliPassword | quote }}
  rabbitmq-password: {{ .Values.credentials.rabbitmq.password | quote }}
  redis-password: {{ .Values.credentials.redis.password | quote }}
  {{- if and .Values.dashboard.enabled .Values.dashboard.admin.password (not .Values.dashboard.admin.existingSecret) }}
  dashboard-admin-password: {{ .Values.dashboard.admin.password | quote }}
  {{- end }}
  {{- if and .Values.dashboard.enabled .Values.dashboard.oidc.enabled .Values.dashboard.oidc.clientSecret (not .Values.dashboard.oidc.existingSecret) }}
  oidc-client-secret: {{ .Values.dashboard.oidc.clientSecret | quote }}
  {{- end }}
