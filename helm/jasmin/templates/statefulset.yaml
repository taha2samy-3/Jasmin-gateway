apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jasmin.fullname" . }}
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "jasmin.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "jasmin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jasmin.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if or .Values.podSecurityContext (and .Values.sysctls.enabled (not .Values.hostNetwork)) }}
      securityContext:
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.sysctls.enabled (not .Values.hostNetwork) }}
        sysctls:
          {{- if .Values.sysctls.safe.enabled }}
          {{- range $name, $value := .Values.sysctls.safe.values }}
          - name: {{ $name }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.sysctls.unsafe.enabled }}
          {{- range $name, $value := .Values.sysctls.unsafe.values }}
          - name: {{ $name }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: REDIS_CLIENT_HOST
              value: {{ include "jasmin.redisHost" . | quote }}
            - name: REDIS_CLIENT_PORT
              value: {{ include "jasmin.redisPort" . | quote }}
            - name: REDIS_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.credentials.redis.existingSecret }}
                  key: {{ default "redis-password" .Values.credentials.redis.existingSecretKey }}
                  optional: true
            - name: AMQP_BROKER_HOST
              value: {{ include "jasmin.rabbitmqHost" . | quote }}
            - name: AMQP_BROKER_PORT
              value: {{ include "jasmin.rabbitmqPort" . | quote }}
            - name: AMQP_BROKER_USER
              value: {{ .Values.credentials.rabbitmq.username | quote }}
            - name: AMQP_BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.credentials.rabbitmq.existingSecret }}
                  key: {{ default "rabbitmq-password" .Values.credentials.rabbitmq.existingSecretKey }}
            - name: AMQP_BROKER_VHOST
              value: {{ .Values.credentials.rabbitmq.vhost | quote }}
            - name: JCLI_ADMIN_USERNAME
              value: {{ .Values.credentials.jcli.username | quote }}
            - name: JCLI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.credentials.jcli.existingSecret }}
                  key: {{ default "jcli-password" .Values.credentials.jcli.existingSecretKey }}
            - name: START_EMBEDDED_INTERCEPTOR
              value: {{ ternary "true" "false" .Values.interceptor.embedded | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: smpp
              containerPort: {{ .Values.service.ports.smpp.targetPort }}
              protocol: TCP
            - name: http-api
              containerPort: {{ .Values.service.ports.httpApi.targetPort }}
              protocol: TCP
            - name: jcli
              containerPort: {{ .Values.service.ports.jcli.targetPort }}
              protocol: TCP
            - name: interceptor
              containerPort: {{ .Values.service.ports.interceptor.targetPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http-api
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/jasmin/jasmin.cfg
              subPath: jasmin.cfg
            - name: config-volume
              mountPath: /etc/jasmin/interceptor.cfg
              subPath: interceptor.cfg
            {{- if .Values.jasminRoutes.enabled }}
            - name: config-volume
              mountPath: /etc/jasmin/routes.json
              subPath: routes.json
            {{- end }}
            - name: store
              mountPath: /etc/jasmin/store
            - name: logs
              mountPath: /var/log/jasmin
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.dashboard.enabled }}
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}{{ if .Values.dashboard.image.digest }}@{{ .Values.dashboard.image.digest }}{{ else }}:{{ .Values.dashboard.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: JASMIN_CONFIG_PATH
              value: "/etc/jasmin/jasmin.cfg"
            - name: JCLI_HOST
              value: "127.0.0.1"
            - name: JCLI_PORT
              value: {{ .Values.service.ports.jcli.targetPort | quote }}
            - name: JCLI_ADMIN_USERNAME
              value: {{ .Values.credentials.jcli.username | quote }}
            - name: JCLI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.credentials.jcli.existingSecret }}
                  key: {{ default "jcli-password" .Values.credentials.jcli.existingSecretKey }}
            - name: HTTP_API_URL
              value: "http://127.0.0.1:{{ .Values.service.ports.httpApi.targetPort }}"
            - name: RABBITMQ_HOST
              value: {{ if .Values.rabbitmq.enabled }}{{ printf "%s-rabbitmq" (include "jasmin.fullname" .) | quote }}{{ else }}{{ .Values.externalRabbitMQ.host | quote }}{{ end }}
            - name: RABBITMQ_PORT
              value: {{ if .Values.rabbitmq.enabled }}{{ .Values.rabbitmq.port | quote }}{{ else }}{{ .Values.externalRabbitMQ.port | quote }}{{ end }}
            - name: RABBITMQ_USER
              value: {{ .Values.credentials.rabbitmq.username | quote }}
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.credentials.rabbitmq.existingSecret }}
                  key: {{ default "rabbitmq-password" .Values.credentials.rabbitmq.existingSecretKey }}
            - name: RABBITMQ_VHOST
              value: {{ .Values.credentials.rabbitmq.vhost | quote }}
            # Created by the console itself (as its own user) inside the store volume.
            - name: DATA_DIR
              value: "/data/console"
            - name: ADMIN_USERNAME
              value: {{ .Values.dashboard.admin.username | quote }}
            {{- if or .Values.dashboard.admin.password .Values.dashboard.admin.existingSecret }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.dashboard.admin.existingSecret }}
                  key: {{ .Values.dashboard.admin.existingSecretKey | default "dashboard-admin-password" }}
            {{- end }}
            {{- with .Values.dashboard.publicUrl }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dashboard.trustProxy }}
            - name: TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            - name: SESSION_IDLE_MINUTES
              value: {{ .Values.dashboard.session.idleMinutes | quote }}
            - name: SESSION_MAX_HOURS
              value: {{ .Values.dashboard.session.maxHours | quote }}
            {{- if .Values.dashboard.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ required "dashboard.oidc.issuerUrl is required when dashboard.oidc.enabled" .Values.dashboard.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "dashboard.oidc.clientId is required when dashboard.oidc.enabled" .Values.dashboard.oidc.clientId | quote }}
            {{- if or .Values.dashboard.oidc.clientSecret .Values.dashboard.oidc.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "jasmin.fullname" .)) .Values.dashboard.oidc.existingSecret }}
                  key: {{ .Values.dashboard.oidc.existingSecretKey | default "oidc-client-secret" }}
            {{- end }}
            - name: OIDC_DISPLAY_NAME
              value: {{ .Values.dashboard.oidc.displayName | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.dashboard.oidc.scopes | quote }}
            - name: OIDC_ROLE_CLAIM
              value: {{ .Values.dashboard.oidc.roleClaim | quote }}
            - name: OIDC_ROLE_MAP
              value: {{ .Values.dashboard.oidc.roleMap | quote }}
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/jasmin/jasmin.cfg
              subPath: jasmin.cfg
              readOnly: true
            - name: logs
              mountPath: /var/log/jasmin
              readOnly: true
            # Console accounts and audit log, kept on the persistent store volume.
            # (No subPath: kubelet-created subPath directories are owned by root.)
            - name: store
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- with .Values.dashboard.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "jasmin.fullname" . }}-config
        {{- if not .Values.persistence.enabled }}
        - name: store
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: store
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
    - metadata:
        name: logs
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: 2Gi
  {{- end }}
