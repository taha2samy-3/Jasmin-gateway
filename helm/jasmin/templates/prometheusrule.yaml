{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "jasmin.fullname" . }}
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ include "jasmin.fullname" . }}.alerts
      rules:
        # Metric names below are the ones Jasmin 0.11.1 exports on <http-api>/metrics.
        # smppc_* counters are per connector (label cid): currently connected = connected - disconnected.
        # The increase() term avoids alerting on connectors that were deliberately stopped long ago.
        - alert: JasminSMPPConnectorDown
          expr: |
            (smppc_connected_count{namespace="{{ .Release.Namespace }}"} - smppc_disconnected_count{namespace="{{ .Release.Namespace }}"}) < 1
            and increase(smppc_disconnected_count{namespace="{{ .Release.Namespace }}"}[15m]) > 0
          for: {{ .Values.monitoring.prometheusRule.rules.smppConnectorDown.for | default "1m" }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.rules.smppConnectorDown.severity | default "critical" }}
            {{- with .Values.monitoring.prometheusRule.rules.smppConnectorDown.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Jasmin SMPP connector {{`{{ $labels.cid }}`}} is disconnected"
            description: "SMPP client connector {{`{{ $labels.cid }}`}} in namespace {{ .Release.Namespace }} lost its connection and has not reconnected."

        - alert: JasminHighSubmitErrorRate
          # HTTP API submissions rejected for routing, throughput, charging or server errors
          # (authentication failures are client mistakes and are excluded).
          expr: |
            (
              sum by (namespace, pod) (
                rate(httpapi_route_error_count{namespace="{{ .Release.Namespace }}"}[5m])
                + rate(httpapi_throughput_error_count{namespace="{{ .Release.Namespace }}"}[5m])
                + rate(httpapi_charging_error_count{namespace="{{ .Release.Namespace }}"}[5m])
                + rate(httpapi_server_error_count{namespace="{{ .Release.Namespace }}"}[5m])
              )
              /
              clamp_min(sum by (namespace, pod) (rate(httpapi_request_count{namespace="{{ .Release.Namespace }}"}[5m])), 0.001)
            ) > {{ .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.threshold | default "0.05" }}
          for: {{ .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.for | default "2m" }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.severity | default "warning" }}
            {{- with .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Jasmin high message submit error rate"
            description: "More than {{ mulf (.Values.monitoring.prometheusRule.rules.highSubmitErrorRate.threshold | default "0.05" | float64) 100 }}% of HTTP API submissions are failing in namespace {{ .Release.Namespace }}."

        - alert: JasminSMPPServerSubmitErrors
          expr: |
            (
              sum by (namespace, pod) (rate(smppsapi_other_submit_error_count{namespace="{{ .Release.Namespace }}"}[5m]) + rate(smppsapi_throttling_error_count{namespace="{{ .Release.Namespace }}"}[5m]))
              /
              clamp_min(sum by (namespace, pod) (rate(smppsapi_submit_sm_request_count{namespace="{{ .Release.Namespace }}"}[5m])), 0.001)
            ) > {{ .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.threshold | default "0.05" }}
          for: {{ .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.for | default "2m" }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.severity | default "warning" }}
            {{- with .Values.monitoring.prometheusRule.rules.highSubmitErrorRate.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Jasmin SMPP server rejecting submissions"
            description: "SMPP clients see a high rate of submit_sm errors or throttling in namespace {{ .Release.Namespace }}."

        - alert: JasminReactorHighCPU
          expr: rate(container_cpu_usage_seconds_total{container="{{ .Chart.Name }}",namespace="{{ .Release.Namespace }}"}[2m]) > 0.90
          for: {{ .Values.monitoring.prometheusRule.rules.reactorHighCPU.for | default "5m" }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.rules.reactorHighCPU.severity | default "warning" }}
            {{- with .Values.monitoring.prometheusRule.rules.reactorHighCPU.additionalLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Jasmin single-core Twisted reactor near saturation"
            description: "Jasmin core process CPU usage exceeds 90% of a single core for >5m in namespace {{ .Release.Namespace }}. Consider horizontal scaling."

        {{- with .Values.monitoring.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}

