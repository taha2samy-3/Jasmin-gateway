{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jasmin.fullname" . }}
  labels:
    {{- include "jasmin.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- /* group/kind written out: the API server defaults them, so server-side diffs (Argo CD) stay clean. */}}
    {{- range .Values.httpRoute.parentRefs }}
    - group: {{ .group | default "gateway.networking.k8s.io" }}
      kind: {{ .kind | default "Gateway" }}
      name: {{ .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
      {{- if .port }}
      port: {{ .port }}
      {{- end }}
    {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- toYaml .Values.httpRoute.rules | nindent 4 }}
    {{- else if .Values.httpRoute.endpoints }}
    {{- range $key, $endpoint := .Values.httpRoute.endpoints }}
    {{- if $endpoint.enabled }}
    - matches:
        {{- if $endpoint.methods }}
        {{- range $endpoint.methods }}
        - path:
            type: {{ $endpoint.pathType | default "PathPrefix" }}
            value: {{ $endpoint.path }}
          method: {{ . }}
        {{- end }}
        {{- else }}
        - path:
            type: {{ $endpoint.pathType | default "PathPrefix" }}
            value: {{ $endpoint.path }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "jasmin.fullname" $ }}
          port: {{ default $.Values.service.ports.httpApi.port $endpoint.port }}
          weight: 1
    {{- end }}
    {{- end }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "jasmin.fullname" . }}
          port: {{ .Values.service.ports.httpApi.port }}
          weight: 1
    {{- end }}
{{- end }}
