# Default values for Jasmin SMS Gateway Helm Chart.

replicaCount: 1

# StatefulSet Update Strategy
# Recommended: type: OnDelete or RollingUpdate with partition to prevent unexpected restarts
# from dropping active, long-lived SMPP connections during configuration updates.
updateStrategy:
  type: RollingUpdate
  # rollingUpdate:
  #   partition: 0

image:
  repository: ghcr.io/taha2samy-3/jasmin
  tag: "0.11.1"
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets for private registries, e.g. [{name: ghcr-pull}]
imagePullSecrets: []

# Extra labels added to the pod
podLabels: {}

priorityClassName: ""

# Time given to Jasmin to unbind SMPP sessions and flush queues before it is killed.
terminationGracePeriodSeconds: 60

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # Jasmin and the console never call the Kubernetes API: keep the API token out of the pod.
  # (No Role/RoleBinding is needed; set true only if a sidecar you add requires API access.)
  automountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "1401"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# =============================================================================
# Kernel Network Stack Tuning (sysctls)
# Fine-tune TCP socket queues, buffers, and timeouts for high-throughput telecom workloads.
# Note: sysctls are applied only when hostNetwork is false.
# =============================================================================
sysctls:
  enabled: false
  # Safe sysctls (namespaced, allowed in Kubernetes 1.29+ / 1.32+ without kubelet flags)
  safe:
    enabled: true
    values:
      net.ipv4.tcp_syncookies: "1"
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_fin_timeout: "30"
      net.ipv4.tcp_rmem: "4096 131072 6291456"
      net.ipv4.tcp_wmem: "4096 65536 6291456"
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "10"
      net.ipv4.tcp_keepalive_probes: "6"
  # Unsafe sysctls (require --allowed-unsafe-sysctls on kubelet)
  unsafe:
    enabled: false
    values:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_max_syn_backlog: "4096"

# Set hostNetwork to true only if running on bare-metal without a LoadBalancer
# or if you strictly need the pod to bind directly to the node's network interfaces.
# In 99% of cases, hostNetwork is NOT needed; use service.type: LoadBalancer instead.
hostNetwork: false

# Networking & Kubernetes Services
service:
  type: ClusterIP
  # When using type: LoadBalancer or NodePort, set externalTrafficPolicy to "Local"
  # to preserve real client source IP addresses (essential for Jasmin IP filtering)
  externalTrafficPolicy: "Local"
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  annotations: {}
  # Administrative ports (jCLI 8990, interceptor PB 8987, console 3000) are only added to this
  # Service when it is ClusterIP. With LoadBalancer/NodePort they stay internal unless this is
  # true: jCLI is a plaintext admin console and must never face the internet.
  # They are always reachable in-cluster through the "<release>-jasmin-admin" ClusterIP Service.
  exposeAdminPorts: false
  ports:
    smpp:
      port: 2775
      targetPort: 2775
      protocol: TCP
      name: smpp
      # nodePort: 32775
    httpApi:
      port: 1401
      targetPort: 1401
      protocol: TCP
      name: http-api
      # nodePort: 31401
    jcli:
      port: 8990
      targetPort: 8990
      protocol: TCP
      name: jcli
      # nodePort: 30990
    interceptor:
      port: 8987
      targetPort: 8987
      protocol: TCP
      name: interceptor
      # nodePort: 30987

# =============================================================================
# Jasmin Enterprise Web Dashboard (Sidecar Container in Pod)
# Runs as a dedicated container in the same Pod, sharing localhost & config
# =============================================================================
dashboard:
  enabled: true
  image:
    repository: ghcr.io/taha2samy-3/jasmin-dashboard
    tag: "latest"
    digest: ""
    pullPolicy: IfNotPresent
  port: 3000
  # nodePort: 33000

  # External URL of the console (scheme + host [+ port]), e.g. https://jasmin.example.com.
  # Required for single sign-on: the OIDC redirect URI is <publicUrl>/auth/oidc/callback.
  publicUrl: ""
  # Set when the console is behind a reverse proxy / ingress (Express "trust proxy"), e.g. "1".
  # Defaults to "1" when dashboard.httpRoute or dashboard.ingress is enabled.
  trustProxy: ""

  # Expose the console on its own hostname (it serves from "/", not from a sub-path).
  # WebSockets (/ws/*) are used for live data and the jCLI console: make sure the gateway or
  # ingress controller allows long-lived connections (e.g. nginx proxy-read-timeout).
  httpRoute:
    enabled: false
    parentRefs: []   # defaults to httpRoute.parentRefs
    hostnames: []    # e.g. ["jasmin-console.example.com"]
    annotations: {}
  ingress:
    enabled: false
    className: ""
    host: ""         # e.g. jasmin-console.example.com
    annotations: {}
    #  nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    #  nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls: []

  # Initial administrator, created on first start when no active admin exists.
  # Leave password empty to generate one: it is printed once in the dashboard container log.
  admin:
    username: admin
    password: ""
    existingSecret: ""
    existingSecretKey: "dashboard-admin-password"

  session:
    idleMinutes: 60
    maxHours: 12

  # OpenID Connect single sign-on (tested with Microsoft Entra ID).
  # New SSO users wait in "pending" until an administrator approves them with a role
  # (admin / operator / viewer), unless roleMap assigns one from the token.
  oidc:
    enabled: false
    # Entra ID: https://login.microsoftonline.com/<tenant-id>/v2.0
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: "oidc-client-secret"
    displayName: "Microsoft"
    scopes: "openid profile email"
    # Claim carrying app roles or groups (Entra app roles arrive in "roles").
    roleClaim: "roles"
    # Optional automatic role assignment, e.g. "admin=Jasmin.Admin,operator=Jasmin.Operator,viewer=Jasmin.Viewer".
    # Empty: every new SSO user is pending until approved in "Access & audit".
    roleMap: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Kubernetes Standard Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jasmin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# Kubernetes Gateway API HTTPRoute (gateway.networking.k8s.io/v1)
# Exposes Jasmin HTTP API (Port 1401) to external traffic through Gateway API
# =============================================================================
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: "my-gateway"
      namespace: "default"
      sectionName: "http"
  hostnames:
    - "jasmin.example.com"

  # Option 1: Modular Jasmin API Endpoint Presets (active when rules: [] is empty)
  # Easily toggle or customize Jasmin HTTP endpoints (/send, /rate, /balance, /ping, /metrics)
  endpoints:
    send:
      enabled: true
      path: /send
      pathType: PathPrefix
      methods: [GET, POST]
    rate:
      enabled: true
      path: /rate
      pathType: PathPrefix
      methods: [GET]
    balance:
      enabled: true
      path: /balance
      pathType: PathPrefix
      methods: [GET]
    ping:
      enabled: true
      path: /ping
      pathType: PathPrefix
      methods: [GET]
    metrics:
      enabled: false  # Expose only if external Prometheus scraping via Gateway API is desired
      path: /metrics
      pathType: PathPrefix
      methods: [GET]
    # The console is exposed on its own hostname: see dashboard.httpRoute / dashboard.ingress.

  # Option 2: Full custom rules array (overrides endpoints if specified)
  rules: []
    # - matches:
    #     - path:
    #         type: PathPrefix
    #         value: /send
    #       method: POST
    #   backendRefs:
    #     - name: jasmin
    #       port: 1401

# Persistence for /etc/jasmin/store and /var/log/jasmin
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  logsSize: 2Gi
  annotations: {}

# Authentication Credentials
credentials:
  jcli:
    # Single source for the jCLI admin account (used by Jasmin, the bootstrap job and the console).
    username: "jcliadmin"
    # Empty: a random password is generated once and kept across upgrades.
    password: ""
    existingSecret: ""
    existingSecretKey: "jcli-password"
  rabbitmq:
    username: "guest"
    password: "guestpassword"
    vhost: "/"
    existingSecret: ""
    existingSecretKey: "rabbitmq-password"
  redis:
    password: ""
    existingSecret: ""
    existingSecretKey: "redis-password"

# Redis / RabbitMQ are not bundled with this chart: point Jasmin at your own services.
# (Setting redis.enabled / rabbitmq.enabled to true fails the install with a clear message.)
redis:
  enabled: false
  port: 6379

externalRedis:
  host: "redis-service"
  port: 6379

# RabbitMQ Integration
rabbitmq:
  enabled: false
  port: 5672

externalRabbitMQ:
  host: "rabbitmq-service"
  port: 5672

# =========================================================================
# Structured Jasmin Gateway Configurations (directly customizable from values)
# =========================================================================
config:
  logLevel: "INFO"
  logPrivacy: false

  # [smpp-server]
  smppServer:
    bind: "0.0.0.0"
    port: 2775
    billingFeature: false
    dlrExpiry: 86400
    sessionInitTimerSecs: 30
    enquireLinkTimerSecs: 30
    inactivityTimerSecs: 300
    responseTimerSecs: 60
    pduReadTimerSecs: 10

  # [smpp-server-pb]
  # The PB services below are only used by jCLI and interceptord inside the pod and have no
  # (or weak) authentication: they listen on localhost so other pods cannot reach them.
  smppServerPb:
    bind: "127.0.0.1"
    port: 14000
    authentication: false

  # [client-management]
  clientManagement:
    bind: "127.0.0.1"
    port: 8989
    storePath: "/etc/jasmin/store"

  # [router]
  router:
    bind: "127.0.0.1"
    port: 8988
    storePath: "/etc/jasmin/store"

  # [http-api]
  httpApi:
    bind: "0.0.0.0"
    port: 1401
    showJasminVersion: true

  # [jcli]
  # Credentials come from credentials.jcli (one place for Jasmin, bootstrap and console).
  jcli:
    bind: "0.0.0.0"
    port: 8990
    authentication: true

  # [redis-client]
  redisClient:
    dbid: 0
    poolsize: 30

  # [amqp-broker]
  amqpBroker:
    vhost: "/"

  # [interceptor-client]
  interceptorClient:
    host: "127.0.0.1"
    port: 8987

  # [sm-listener]
  smListener:
    # Publish carrier responses (submit_sm_resp) on submit.sm.resp.<cid>.
    # Required by the dashboard's live traffic view to show acceptance and latency.
    publishSubmitSmResp: true

  # [dlr]
  dlr:
    dlrLookupRetryDelay: 180
    dlrLookupMaxRetries: 1

  # [deliversm-thrower]
  deliversmThrower:
    httpTimeout: 10
    retryDelay: 90
    maxRetries: 2

  # [interceptor-pb]
  # Interceptors execute Python code: keep the PB endpoint private to the pod.
  interceptorPb:
    bind: "127.0.0.1"
    port: 8987
    # Authentication uses Jasmin's default interceptor credentials, which jasmind's
    # interceptor client also uses; keep it on.
    authentication: true

  # Raw extra INI directives to append to jasmin.cfg
  extraConfig: ""
  # Full override of jasmin.cfg if needed
  customJasminCfg: ""
  # Full override of interceptor.cfg if needed
  customInterceptorCfg: ""

# =============================================================================
# Jasmin SMS HTTP Connectors and Routing Profiles (Internal Jasmin Routing)
# Automatically provisioned into Jasmin jCLI on startup via bootstrap-routes.py
# =============================================================================
jasminRoutes:
  enabled: false
  # HTTP Client Connectors (httpccm) for throwing incoming MO SMS to HTTP webhooks
  httpConnectors: []
    # Example:
    # - cid: "webhook_01"
    #   url: "http://webhook-service.default.svc.cluster.local:8080/sms/incoming"
    #   method: "POST"
  # Inbound SMS MO Routes (morouter)
  moRoutes: []
    # Example:
    # - type: "DefaultRoute"
    #   connector: "http(webhook_01)"
    # - type: "StaticMORoute"
    #   order: 10
    #   connector: "http(webhook_01)"
  # Outbound SMS MT Routes (mtrouter)
  mtRoutes: []
    # Example:
    # - type: "DefaultRoute"
    #   rate: "0.0"
    #   connector: "smppc(upstream_smpp_01)"

# Interceptor Options
interceptor:
  # Connect jasmind to the interceptor (--enable-interceptor-client).
  enabled: true
  # Run interceptord inside the Jasmin container.
  embedded: true

# Monitoring & Alerting
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    annotations: {}
    rules:
      smppConnectorDown:
        severity: critical
        for: 1m
        additionalLabels: {}
      highSubmitErrorRate:
        severity: warning
        for: 2m
        threshold: "0.05"
        additionalLabels: {}
      reactorHighCPU:
        severity: warning
        for: 5m
        additionalLabels: {}
    additionalRules: []

# =============================================================================
# Autoscaling (Vertical Pod Autoscaler)
# Provides data-driven resource recommendations for Jasmin's Twisted reactor and Python heap.
# =============================================================================
autoscaling:
  vpa:
    enabled: false
    updateMode: "Off" # "Off" (recommendations only, safe for SMPP), "Initial", or "InPlaceOrRecreate"
    controlledResources:
      - cpu
      - memory
    labels: {}
    annotations: {}
    minAllowed:
      cpu: 250m
      memory: 512Mi
    maxAllowed:
      cpu: 2000m
      memory: 8Gi

# Resource limits & requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Kubernetes 1.33+ In-Place Pod Resource Resizing (resizePolicy)
# Allows resizing container CPU and memory limits on-the-fly without restarting the container,
# preventing SMPP disconnects and downtime.
resizePolicy: []
  # - resourceName: cpu
  #   restartPolicy: NotRequired
  # - resourceName: memory
  #   restartPolicy: NotRequired

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables to inject into the Jasmin container
extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom_value"

# Extra envFrom sources (e.g. from existing ConfigMaps or Secrets)
extraEnvFrom: []
  # - configMapRef:
  #     name: my-custom-config

# Extra volumes to attach to the StatefulSet pod
extraVolumes: []
  # - name: custom-interceptors
  #   configMap:
  #     name: custom-interceptor-scripts

# Extra volume mounts to mount inside the Jasmin container
extraVolumeMounts: []
  # - name: custom-interceptors
  #   mountPath: /etc/jasmin/interceptors
  #   readOnly: true

# =============================================================================
# PodDisruptionBudget (PDB)
# Guarantees that node draining, Kubernetes cluster upgrades, or auto-scaling events
# never terminate the active Jasmin instance without replacement.
# =============================================================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
  labels: {}
  annotations: {}

# =============================================================================
# Hardened Telecom NetworkPolicy
# Restricts administrative jCLI port 8990 strictly to localhost/sidecar,
# limits SMPP ingress (2775) to trusted carrier/client CIDRs, and protects the HTTP API.
# =============================================================================
networkPolicy:
  enabled: false
  smpp:
    from: []
      # - ipBlock:
      #     cidr: 10.0.0.0/8
  httpApi:
    from: []
  dashboard:
    from: []
  metrics:
    from: []
  jcli:
    from: []
  egress: []
